<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoodMate | บริษัท เงินดีมีชัย จำกัด</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
:root{font-family:'Noto Sans Thai',sans-serif;color:#20383a;background:#f3f7f7}*{box-sizing:border-box}body{margin:0;font-size:16px}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #dce8e7;padding:15px clamp(18px,5vw,70px);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:700;font-size:24px;color:#176e70}.brand span{color:#ea986d}header small{color:#567274}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 72px}.intro{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:25px}h1{font-size:clamp(28px,4vw,44px);line-height:1.3;margin:0 0 7px}h2{font-size:23px;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.7;margin:0 0 12px;color:#526d70}.tag{background:#dff3ef;color:#176e70;border-radius:40px;padding:8px 13px;font-size:14px;font-weight:600}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}.nav,.panel{background:#fff;border:1px solid #dce8e7;border-radius:24px;box-shadow:0 14px 35px rgba(34,75,78,.05)}.nav{padding:15px;height:max-content;display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;color:#476569;border-radius:13px;padding:13px 15px}.nav button.active{background:#dff3ef;color:#136567;font-weight:700}.panel{padding:clamp(20px,4vw,38px);min-height:510px}.step{font-size:13px;font-weight:700;color:#298589;letter-spacing:.03em;margin-bottom:7px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0 25px}.choice{border:1px solid #cbdcdb;background:#fff;padding:11px 16px;border-radius:15px;color:#315358;min-height:48px}.choice.selected{border-color:#197b7b;background:#ddf4ef;color:#0c5e60;font-weight:700}.primary,.secondary{border:0;border-radius:14px;padding:13px 20px;font-weight:700;min-height:48px}.primary{background:#116d70;color:white}.secondary{background:#e9f3f2;color:#176e70}.action{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #d9e6e4;border-radius:18px;padding:16px;background:#fff}.card strong{display:block}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#e5f3f1;font-size:39px;margin-bottom:10px}.scene{border-radius:22px;padding:25px;min-height:215px;background:linear-gradient(125deg,#b8e5df,#e5f3d7);position:relative;overflow:hidden}.scene.sea{background:linear-gradient(#a8dbe6 0 49%,#eff1db 50%)}.scene.mountain{background:linear-gradient(155deg,#c8e2e6,#aec5b7,#e2e9ce)}.scene.waterfall{background:linear-gradient(140deg,#9dd1cf,#dee9e2,#a8c3af)}.scene.home{background:linear-gradient(140deg,#edd4be,#f3eee1,#c8dccd)}.scene.park{background:linear-gradient(130deg,#d7eac1,#acd6bd,#c8e8e1)}.scene.car{background:linear-gradient(120deg,#8cb6b9,#dbe8e4,#b7c9cf)}.scene .character{font-size:75px;display:block}.scene b{font-size:22px}.scene p{color:#284c4d;max-width:580px}.chatbox{background:#f4f8f8;border-radius:18px;padding:16px;margin-top:16px;min-height:115px}.bubble{padding:12px 15px;background:white;border-radius:14px;max-width:90%;margin-bottom:10px}.bubble.me{margin-left:auto;background:#dff3ef}.chatrow{display:flex;gap:8px;margin-top:12px}.chatrow input{flex:1;min-width:0;border:1px solid #cadcda;border-radius:13px;padding:12px}.notice{font-size:13px;color:#5b7474;margin-top:14px}.doctors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.doctor{border:1px solid #dce8e7;border-radius:18px;padding:17px;background:white}.doctor .avatar{background:#edf1f2}.doctor.selected{border:2px solid #187b7e;background:#f4fbf9}.calendar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}label{display:block;font-weight:600;margin:16px 0 7px}input[type=date]{padding:12px;border:1px solid #cbdcdb;border-radius:12px;min-width:220px}.price{background:#eaf6f2;border-radius:16px;padding:17px;margin-top:18px}.price strong{font-size:25px;color:#0e6264}.hide{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto;white-space:nowrap}.nav button{flex:0 0 auto}.grid,.doctors{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.doctors{grid-template-columns:1fr}.intro{display:block}.tag{display:inline-block;margin-top:8px}.panel{min-height:0}.wrap{padding:20px 14px}}
.animal-icon{display:inline-block;width:48px;height:48px;vertical-align:middle;margin-right:7px;border-radius:50%;background-image:url(assets/companions.png);background-size:300% 300%;background-repeat:no-repeat}.scene-icon{display:inline-block;width:48px;height:48px;vertical-align:middle;margin-right:7px;border-radius:8px;background-image:url(assets/scenes.png);background-size:300% 300%;background-repeat:no-repeat}.scene{background-image:url(assets/scenes.png)!important;background-size:300% 300%!important}.scene .animal-icon{width:95px;height:95px;border:3px solid white}.doctor-photo{width:100%;height:140px;border-radius:12px;background-image:url(assets/doctors.png)!important;background-size:300% 100%!important;background-repeat:no-repeat}.choice{display:inline-flex;align-items:center}.price{line-height:1.7}</style></head><body><header><div class="brand">mood<span>mate</span></div><small>บริษัท เงินดีมีชัย จำกัด · ต้นแบบเพื่อการศึกษา</small></header><main class="wrap"><div class="intro"><div><h1>พื้นที่พักใจในแบบของคุณ</h1><p>เริ่มจากเช็กอินความรู้สึก แล้วเลือกพื้นที่ที่ทำให้คุณสบายใจ</p></div><span class="tag">ข้อมูลและบุคลากรจำลอง</span></div><div class="layout"><nav class="nav" aria-label="ขั้นตอน"><button class="active" data-page="check">01 เช็กอิน</button><button data-page="personal">02 เลือกสิ่งที่ชอบ</button><button data-page="talk">03 คุยกับ AI</button><button data-page="doctor">04 คุยกับจิตแพทย์</button></nav><section class="panel" id="content"></section></div></main><script>
const friends=[['แมว',''],['หมา',''],['กระต่าย',''],['ไก่',''],['เต่า',''],['หมู',''],['ยีราฟ',''],['อัลปาก้า',''],['เพนกวิน','']];const scenes=['ต้นไม้','บ้านสวย ๆ','รถยนต์เท่ ๆ','ทะเล','น้ำตก','ภูเขา','สวนสาธารณะ','ริมบึง','ริมน้ำ'];const spritePos=i=>`${i%3*50}% ${Math.floor(i/3)*50}%`;const animalIndex=n=>friends.findIndex(x=>x[0]===n);const sceneIndex=n=>scenes.indexOf(n);const icons={'ต้นไม้':'🌳','บ้านสวย ๆ':'🏡','รถยนต์เท่ ๆ':'🚘','ทะเล':'🌊','น้ำตก':'💦','ภูเขา':'⛰️','สวนสาธารณะ':'🌿','ริมบึง':'🪷','ริมน้ำ':'🏞️'};const doctors=[['พญ. อัญชลี','จิตแพทย์ · รับฟังอย่างอ่อนโยน',''],['นพ. ธนัท','จิตแพทย์ · พูดคุยอย่างเป็นกันเอง',''],['พญ. พิมพ์ชนก','จิตแพทย์ · ช่วยจัดการความเครียด','']];let state={page:'check',stress:'',friend:'แมว',scene:'ทะเล',doctor:0,date:'',time:'',messages:[],booked:false};const el=document.getElementById('content');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,fn,kind='primary'){return `<button class="${kind}" onclick="${fn}">${label}</button>`}function go(page){state.page=page;render();document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'})}function set(k,v){state[k]=v;render()}function opts(items,key){return `<div class="choices">${items.map(([n,i])=>`<button class="choice ${state[key]===n?'selected':''}" onclick="set('${key}',${JSON.stringify(n).replace(/"/g,'&quot;')})">${key==='friend'?`<span class="animal-icon" style="background-position:${spritePos(animalIndex(n))}"></span>`:key==='scene'?`<span class="scene-icon" style="background-position:${spritePos(sceneIndex(n))}"></span>`:''}${n}</button>`).join('')}</div>`}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));let h='';if(state.page==='check')h=`<div class="step">ขั้นที่ 1 จาก 4</div><h2>ตอนนี้คุณรู้สึกอย่างไร?</h2><p>เลือกความรู้สึกที่ใกล้เคียงที่สุด ไม่มีคำตอบถูกหรือผิด</p>${opts([['สบายใจ','☀️'],['เหนื่อยนิดหน่อย','🌤️'],['เครียด','☁️'],['หนักใจมาก','🌧️']],'stress')}<div class="action">${btn('เลือกพื้นที่พักใจ →',"go('personal')")}</div><p class="notice">แบบเช็กอินนี้เป็นตัวอย่างการสะท้อนความรู้สึก ไม่ใช่การวินิจฉัยโรค</p>`;if(state.page==='personal')h=`<div class="step">ขั้นที่ 2 จาก 4</div><h2>เลือกเพื่อนคุยและบรรยากาศ</h2><p>เลือกได้ตามใจและเปลี่ยนใหม่ได้ทุกครั้งที่เข้ามา</p><h3>วันนี้อยากให้ใครอยู่เป็นเพื่อน?</h3>${opts(friends,'friend')}<h3>อยากพักใจที่ไหน?</h3>${opts(scenes.map(n=>[n,icons[n]]),'scene')}<div class="action">${btn('เข้าห้องพักใจ →',"go('talk')")}${btn('จองคุยกับคนจริง',"go('doctor')",'secondary')}</div>`;if(state.page==='talk'){let type=({'ทะเล':'sea','ภูเขา':'mountain','น้ำตก':'waterfall','บ้านสวย ๆ':'home','สวนสาธารณะ':'park','รถยนต์เท่ ๆ':'car'}[state.scene]||'park');h=`<div class="step">ขั้นที่ 3 จาก 4</div><h2>ห้องพักใจของคุณ</h2><div class="scene ${type}" style="background-position:${spritePos(sceneIndex(state.scene))}"><span class="character animal-icon" style="background-position:${spritePos(animalIndex(state.friend))}"></span><b>${esc(state.friend)}อยู่เป็นเพื่อนคุณที่${esc(state.scene)}</b><p>ไม่ต้องรีบเล่าอะไรทั้งหมด เริ่มจากเรื่องที่อยากพูดตอนนี้ได้เลย</p></div><div class="chatbox"><div class="bubble">สวัสดี เราอยู่ตรงนี้นะ วันนี้มีเรื่องอะไรที่อยากเล่าไหม?</div>${state.messages.map(x=>`<div class="bubble me">${esc(x)}</div><div class="bubble">ขอบคุณที่เล่าให้ฟัง ลองพักหายใจช้า ๆ สักครู่ได้นะ หากอยากคุยกับคนจริง เราช่วยพาไปเลือกเวลานัดได้</div>`).join('')}</div><div class="chatrow"><input id="message" aria-label="ข้อความ" placeholder="พิมพ์สิ่งที่อยากเล่า..." onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">ส่ง</button><button class="secondary" onclick="speak()">🔊 ฟัง</button><button class="secondary" onclick="voice()">🎙️ พูด</button></div><div class="action">${btn('เปลี่ยนเพื่อนและฉาก',"go('personal')",'secondary')}${btn('นัดคุยกับจิตแพทย์',"go('doctor')")}</div><p class="notice">บทสนทนานี้เป็นตัวอย่างต้นแบบ ยังไม่ได้เชื่อม AI วิเคราะห์อิสระหรือระบบรับเสียงพูดจริง และไม่ใช่บริการรักษา</p>`}if(state.page==='doctor'){h=`<div class="step">ขั้นที่ 4 จาก 4</div><h2>เลือกคนที่คุณรู้สึกสบายใจจะคุยด้วย</h2><p>จิตแพทย์จาก “รพ. อ้อมน้อยสุขภาพดี555” ในโปรเจกต์จำลอง · ปรึกษาออนไลน์ · เวลาปกติ 40 นาที / นอกเวลา 30 นาที</p><div class="doctors">${doctors.map((d,i)=>`<button class="doctor ${state.doctor===i?'selected':''}" onclick="set('doctor',${i})" style="text-align:left"><span class="avatar doctor-photo" style="background-position:${i*50}% 50%"></span><strong>${d[0]}</strong><p>${d[1]}</p><small>ดูเวลาว่างและเลือกนัด</small></button>`).join('')}</div><label for="date">เลือกวันนัด</label><input id="date" type="date" min="${new Date().toISOString().slice(0,10)}" value="${state.date}" onchange="set('date',this.value)"><label>เวลาว่างในวันนั้น</label><div class="calendar">${(state.date?( [0,6].includes(new Date(state.date+'T12:00:00').getDay())?['09:00','10:00','14:00','15:00']:['10:00','13:00','15:30','18:00','19:00']):[]).map(t=>`<button class="choice ${state.time===t?'selected':''}" onclick="set('time','${t}')">${t}</button>`).join('')||'<p>เลือกวันเพื่อดูช่วงเวลาจำลอง</p>'}</div><div class="price">ค่าปรึกษาที่พนักงานจ่าย <strong>${premium()?"1,350 บาท / 30 นาที":"900 บาท / 40 นาที"}</strong><br><small>ยังไม่เปิดรับชำระเงินจริง</small></div><div class="action">${btn('ยืนยันการจองจำลอง', 'book()')}</div>${state.booked?`<p class="tag" role="status" style="display:inline-block;margin-top:17px">จองจำลองสำเร็จ: ${esc(doctors[state.doctor][0])} · ${esc(state.date)} เวลา ${esc(state.time)} น.</p>`:''}<p class="notice">ชื่อโรงพยาบาล ภาพและบุคลากร ตารางนัด และราคาเป็นข้อมูลสมมติสำหรับการเรียน ไม่มีการเชื่อมต่อโรงพยาบาลหรือจองจริง</p>`}el.innerHTML=h}function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('เบราว์เซอร์นี้ยังไม่รองรับการพูดเป็นข้อความ');return}let r=new R();r.lang='th-TH';r.onresult=e=>{let x=document.getElementById('message');if(x)x.value=e.results[0][0].transcript};r.start()}function speak(){if(!('speechSynthesis' in window)){alert('เบราว์เซอร์ไม่รองรับเสียงอ่าน');return}let u=new SpeechSynthesisUtterance('ขอบคุณที่เล่าให้ฟัง ลองพักหายใจช้า ๆ สักครู่ได้นะ');u.lang='th-TH';speechSynthesis.cancel();speechSynthesis.speak(u)}function send(){let input=document.getElementById('message');let value=input?.value.trim();if(value){state.messages.push(value);render();document.getElementById('message').focus()}}function premium(){if(!state.date||!state.time)return false;let d=new Date(state.date+"T12:00:00").getDay();return d===0||d===6||Number(state.time.slice(0,2))>=18}function book(){if(!state.date||!state.time){alert('กรุณาเลือกวันและเวลาก่อน');return}state.booked=true;render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
