</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script></head><body><header><div class="brand">mood<span>mate</span></div><small>บริษัท เงินดีมีชัย จำกัด · สวัสดิการดูแลใจพนักงาน 1,000 คน</small></header><main class="wrap"><div class="intro"><div><h1>พื้นที่พักใจในแบบของคุณ</h1><p>เริ่มจากเช็กอินความรู้สึก แล้วเลือกพื้นที่ที่ทำให้คุณสบายใจ</p></div><span class="tag">พื้นที่ส่วนตัวของคุณ</span></div><div class="layout"><nav class="nav" aria-label="ขั้นตอน"><button class="active" data-page="check">01 เช็กอิน</button><button data-page="personal">02 เลือกสิ่งที่ชอบ</button><button data-page="talk">03 คุยกับ AI</button><button data-page="articles">04 มุมอ่านพักใจ</button><button data-page="doctor">05 พบผู้เชี่ยวชาญ</button></nav><section class="panel" id="content"></section></div></main><script>

{title:'พักใจ 3 นาที เมื่องานถาโถม',sub:'กลับมาอยู่กับปัจจุบันทีละนิด',body:'<p>เมื่อมีหลายเรื่องเข้ามาพร้อมกัน ลองหยุดและวางเท้าทั้งสองข้างบนพื้น สังเกตว่าร่างกายกำลังสัมผัสอะไรอยู่</p><ol><li>มองหาสิ่งที่เห็นรอบตัว 5 อย่าง</li><li>ฟังเสียงที่ได้ยิน 3 อย่าง</li><li>ค่อย ๆ เลือกงานเพียงหนึ่งเรื่องที่เริ่มได้ตอนนี้</li></ol><p>หากยังหนักใจ คุณไม่จำเป็นต้องจัดการทุกอย่างในครั้งเดียว</p>'},
{title:'เลิกงานแล้ว แต่ใจยังอยู่ที่งาน',sub:'ทำพิธีเลิกงานเล็ก ๆ ให้ตัวเอง',body:'<p>ก่อนปิดวัน ลองจดงานที่ค้างและขั้นตอนแรกของวันพรุ่งนี้ไว้สั้น ๆ แล้วปิดหน้าจอสักครู่</p><p>ระหว่างเดินทางกลับหรือเมื่อถึงบ้าน ลองทำกิจกรรมที่บอกตัวเองว่า “ตอนนี้เป็นเวลาพัก” เช่น อาบน้ำ ฟังเพลง หรือเดินเบา ๆ โดยไม่ต้องบังคับให้ตัวเองหายเครียดทันที</p>'},
{title:'เครียดจนไม่รู้จะเริ่มตรงไหน',sub:'แยกสิ่งที่ทำได้วันนี้',body:'<p>เขียนสิ่งที่กังวลออกมา แล้วแบ่งเป็นสามช่อง: ทำได้วันนี้ ต้องรอข้อมูล และอยู่นอกการควบคุม</p><p>เลือกหนึ่งอย่างจากช่องแรกที่ใช้เวลาไม่เกิน 10 นาที หากทำเสร็จแล้วค่อยเลือกเรื่องต่อไป การพักก็เป็นหนึ่งในสิ่งที่เลือกทำได้</p>'},
{title:'วันที่อยากให้ใครสักคนฟัง',sub:'ขอความช่วยเหลือให้ตรงความต้องการ',body:'<p>ลองเริ่มบทสนทนาด้วยประโยคง่าย ๆ เช่น “วันนี้เหนื่อยมาก ขอเล่าให้ฟังหน่อยได้ไหม” แล้วบอกอีกฝ่ายว่าอยากให้รับฟัง ช่วยคิดทางเลือก หรืออยู่เป็นเพื่อนเฉย ๆ</p><p>ถ้ายังไม่พร้อมเล่าทั้งหมด คุณเริ่มจากเรื่องเล็ก ๆ ก่อนก็ได้ หรือเลือกนัดคุยกับผู้เชี่ยวชาญ</p>'},
