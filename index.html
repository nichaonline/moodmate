{title:'พักใจ 3 นาที เมื่องานถาโถม',sub:'กลับมาอยู่กับปัจจุบันทีละนิด',body:'<p>เมื่อมีหลายเรื่องเข้ามาพร้อมกัน ลองหยุดและวางเท้าทั้งสองข้างบนพื้น สังเกตว่าร่างกายกำลังสัมผัสอะไรอยู่</p><ol><li>มองหาสิ่งที่เห็นรอบตัว 5 อย่าง</li><li>ฟังเสียงที่ได้ยิน 3 อย่าง</li><li>ค่อย ๆ เลือกงานเพียงหนึ่งเรื่องที่เริ่มได้ตอนนี้</li></ol><p>หากยังหนักใจ คุณไม่จำเป็นต้องจัดการทุกอย่างในครั้งเดียว</p>'},
{title:'เลิกงานแล้ว แต่ใจยังอยู่ที่งาน',sub:'ทำพิธีเลิกงานเล็ก ๆ ให้ตัวเอง',body:'<p>ก่อนปิดวัน ลองจดงานที่ค้างและขั้นตอนแรกของวันพรุ่งนี้ไว้สั้น ๆ แล้วปิดหน้าจอสักครู่</p><p>ระหว่างเดินทางกลับหรือเมื่อถึงบ้าน ลองทำกิจกรรมที่บอกตัวเองว่า “ตอนนี้เป็นเวลาพัก” เช่น อาบน้ำ ฟังเพลง หรือเดินเบา ๆ โดยไม่ต้องบังคับให้ตัวเองหายเครียดทันที</p>'},
{title:'เครียดจนไม่รู้จะเริ่มตรงไหน',sub:'แยกสิ่งที่ทำได้วันนี้',body:'<p>เขียนสิ่งที่กังวลออกมา แล้วแบ่งเป็นสามช่อง: ทำได้วันนี้ ต้องรอข้อมูล และอยู่นอกการควบคุม</p><p>เลือกหนึ่งอย่างจากช่องแรกที่ใช้เวลาไม่เกิน 10 นาที หากทำเสร็จแล้วค่อยเลือกเรื่องต่อไป การพักก็เป็นหนึ่งในสิ่งที่เลือกทำได้</p>'},
{title:'วันที่อยากให้ใครสักคนฟัง',sub:'ขอความช่วยเหลือให้ตรงความต้องการ',body:'<p>ลองเริ่มบทสนทนาด้วยประโยคง่าย ๆ เช่น “วันนี้เหนื่อยมาก ขอเล่าให้ฟังหน่อยได้ไหม” แล้วบอกอีกฝ่ายว่าอยากให้รับฟัง ช่วยคิดทางเลือก หรืออยู่เป็นเพื่อนเฉย ๆ</p><p>ถ้ายังไม่พร้อมเล่าทั้งหมด คุณเริ่มจากเรื่องเล็ก ๆ ก่อนก็ได้ หรือเลือกนัดคุยกับผู้เชี่ยวชาญ</p>'},

  body=`<h3>ทักษะอารมณ์ที่คุณสะท้อนในครั้งนี้</h3>${names.map((n,i)=>`<div class="wellness-dimension"><span>${n}</span><b>${values[i]} / 6</b></div>`).join('')}<p style="margin-top:18px">ชวนลองฝึกเรื่อง${names[low]}: ${tips[low]}</p><p class="notice">ตัวเลขเป็นเพียงผลรวมคำตอบในแต่ละด้าน ไม่ใช่คะแนน EQ มาตรฐาน ไม่มีเกณฑ์สูงหรือต่ำ และไม่ใช้ประเมินความสามารถในการทำงาน</p>`;
 }else{
  const counts=[0,0,0,0];a.forEach(i=>counts[i]++);const max=Math.max(...counts);const top=counts.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
  body=`<h3>${top.length>1?'คุณมีสไตล์การพักใจแบบผสม':'สไตล์พักใจที่คุณเลือกบ่อยที่สุด'}</h3>${top.map(i=>{const p=wellnessProfiles[i];return `<div class="wellness-profile"><h3>${p.name}</h3><p>${p.desc} · เลือก ${counts[i]} จาก 6 ข้อ</p><p>${p.tip}</p><button class="secondary" onclick="useWellnessProfile(${i})">ลองพักใจกับ${p.friend}ที่${p.scene}</button></div>`;}).join('')}<p class="notice">ความชอบเปลี่ยนได้ ผลครั้งนี้ไม่กำหนดตัวตนของคุณ คุณเลือกเพื่อนและวิวอื่นได้เสมอ</p>`;
 }
 return `<div class="step">พื้นที่สำรวจใจ · ผลของคุณ</div><h2 id="wellnessTitle" tabindex="-1">${test.title}</h2><div class="wellness-result">${body}</div><p class="notice">คำตอบและผลอยู่เฉพาะในแท็บนี้ ไม่ถูกบันทึกหรือส่งให้บริษัท ปิดหรือรีโหลดหน้าเพื่อเริ่มใหม่</p><div class="action">${btn('ไปพักใจ',"go('talk')")}${btn('พบผู้เชี่ยวชาญ',"go('doctor')",'secondary')}${btn('เลือกแบบทดสอบอื่น','wellnessHome()','secondary')}</div>`;
}
function renderWellness(){
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 const el=document.getElementById('content');const test=wellnessTests.find(t=>t.id===wellness.test);
 if(!test){el.innerHTML=`<div class="step">พื้นที่สำรวจใจ</div><h2>รู้จักใจตัวเองทีละนิด</h2><p>เลือกสิ่งที่อยากสำรวจวันนี้ ใช้เวลาเพียงไม่กี่นาที ไม่จำเป็นต้องทำครบทุกแบบ</p><div class="wellness-grid">${wellnessTests.map(t=>`<article class="wellness-card"><div class="wellness-icon">${t.icon}</div><span class="wellness-tag">${t.tag}</span><h3>${t.title}</h3><p>${t.desc}</p><small>${t.time}</small><button class="primary" onclick="startWellness('${t.id}')">เริ่มสำรวจ</button></article>`).join('')}</div><p class="notice">ST-5 เป็นแบบประเมินความเครียดเบื้องต้น อีก 3 แบบเป็นกิจกรรมสำรวจตัวเอง ไม่ใช้วินิจฉัยหรือประเมินผลงาน คำตอบไม่ถูกส่งให้บริษัท</p>`;return;}
 if(wellness.result){el.innerHTML=wellnessResultHTML(test);return;}
 const q=test.questions[wellness.index];const text=Array.isArray(q)?q[0]:q;const choices=Array.isArray(q)?q[1]:test.scale;const picked=wellness.answers[wellness.index];
 el.innerHTML=`<button class="wellness-back" onclick="wellnessHome()">← เลือกแบบทดสอบอื่น</button><div class="step">${test.tag} · ข้อ ${wellness.index+1} จาก ${test.questions.length}</div><h2>${test.title}</h2><p class="notice">${test.note}</p><progress class="wellness-progress" value="${wellness.index+1}" max="${test.questions.length}" aria-label="ความคืบหน้า"></progress><fieldset class="wellness-question"><legend id="wellnessTitle" tabindex="-1">${esc(text)}</legend>${choices.map((c,i)=>`<label class="wellness-option ${picked===i?'is-picked':''}"><input type="radio" name="wellnessAnswer" value="${i}" ${picked===i?'checked':''} onchange="chooseWellness(${i})"><span>${esc(c)}</span></label>`).join('')}</fieldset><div class="action"><button class="secondary" onclick="prevWellness()" ${wellness.index===0?'disabled':''}>ย้อนกลับ</button><button class="primary" onclick="nextWellness()" ${picked===undefined?'disabled':''}>${wellness.index===test.questions.length-1?'ดูผลของฉัน':'ข้อต่อไป →'}</button></div><p class="notice">เลือกคำตอบที่ตรงกับคุณ ไม่มีคำตอบที่ต้องทำให้ใครพอใจ และหยุดได้ทุกเมื่อ</p>`;
}
const renderBeforeWellness=render;
render=function(){
 if(state.page==='quizzes'){renderWellness();return;}
 renderBeforeWellness();
 if(state.page==='check')document.getElementById('content').insertAdjacentHTML('beforeend',`<div class="wellness-invite"><div><h3>อยากรู้จักใจตัวเองมากขึ้นไหม</h3><p>สำรวจความเครียด สภาพใจ EQ และสไตล์การพักใจ เลือกได้ 4 แบบ</p></div><button class="secondary" onclick="go('quizzes')">เลือกแบบทดสอบ →</button></div>`);
};
render();

</script></body></html>
